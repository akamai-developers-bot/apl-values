kind: AplApp
metadata:
    name: knative
spec:
    enabled: true
    resources:
        activator:
            limits:
                cpu: 500m
                memory: 512Mi
            requests:
                cpu: 50m
                memory: 32Mi
        autoscaler:
            limits:
                cpu: "1"
                memory: 1Gi
            requests:
                cpu: 50m
                memory: 64Mi
        autoscalerHpa:
            limits:
                cpu: "1"
                memory: 1Gi
            requests:
                cpu: 50m
                memory: 64Mi
        controller:
            limits:
                cpu: "1"
                memory: 1Gi
            requests:
                cpu: 50m
                memory: 64Mi
        operator:
            limits:
                cpu: "1"
                memory: 1Gi
            requests:
                cpu: 50m
                memory: 64Mi
        operatorWebhook:
            limits:
                cpu: "1"
                memory: 1Gi
            requests:
                cpu: 50m
                memory: 64Mi
        queueSidecar:
            limits:
                cpu: "1"
                memory: 512Mi
            requests:
                cpu: 25m
                memory: 64Mi
        webhook:
            limits:
                cpu: 500m
                memory: 512Mi
            requests:
                cpu: 50m
                memory: 32Mi
    serving:
        gateway:
            autoscaling:
                enabled: true
                maxReplicas: 10
                minReplicas: 2
                targetCPUUtilizationPercentage: 80
                targetMemoryUtilizationPercentage: 80
            minAvailable: 1
            replicas: 2
            resources:
                limits:
                    cpu: 1000m
                    memory: 1024Mi
                requests:
                    cpu: 100m
                    memory: 128Mi
        replicas: 1
