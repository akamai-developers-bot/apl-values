kind: AplApp
metadata:
    name: argocd
spec:
    _rawValues: {}
    applicationSet:
        replicas: 1
    autoscaling:
        repoServer:
            enabled: true
            maxReplicas: 5
            minReplicas: 2
            targetCPUUtilizationPercentage: 80
            targetMemoryUtilizationPercentage: 80
        server:
            enabled: true
            maxReplicas: 5
            minReplicas: 1
            targetCPUUtilizationPercentage: 80
            targetMemoryUtilizationPercentage: 80
    controller:
        replicas: 1
    controllerOperationProcessors: 10
    controllerStatusProcessors: 20
    resources:
        applicationSet:
            limits:
                cpu: "1"
                memory: 1Gi
            requests:
                cpu: 100m
                memory: 256Mi
        controller:
            limits:
                cpu: "2"
                memory: 4Gi
            requests:
                cpu: 200m
                memory: 1Gi
        imageUpdater:
            limits:
                cpu: "1"
                memory: 1Gi
            requests:
                cpu: 50m
                memory: 160Mi
        notifications:
            limits:
                cpu: "1"
                memory: 1Gi
            requests:
                cpu: 50m
                memory: 160Mi
        redis:
            limits:
                cpu: "1"
                memory: 1Gi
            requests:
                cpu: 50m
                memory: 64Mi
        repo:
            limits:
                cpu: "1"
                memory: 1Gi
            requests:
                cpu: 100m
                memory: 640Mi
        server:
            limits:
                cpu: "1"
                memory: 1Gi
            requests:
                cpu: 100m
                memory: 512Mi
