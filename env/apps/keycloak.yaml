kind: AplApp
metadata:
    name: keycloak
spec:
    _rawValues: {}
    adminUsername: otomi-admin
    databaseInitialConnections: 5
    databaseMaxConnections: 28
    databaseMinConnections: 5
    idp:
        alias: otomi-idp
        clientID: otomi
    resources:
        keycloak:
            limits:
                cpu: "2"
                memory: 2Gi
            requests:
                cpu: 100m
                memory: 640Mi
        operator:
            limits:
                cpu: "1"
                memory: 1Gi
            requests:
                cpu: 100m
                memory: 336Mi
    theme: otomi
