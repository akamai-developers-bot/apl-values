# env/manifests/namespaces/headlamp/httproute/headlamp.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: headlamp
spec:
  hostnames:
  - headlamp.lke487006.akamai-apl.net
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: platform
    namespace: istio-system
    sectionName: https
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: headlamp
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
