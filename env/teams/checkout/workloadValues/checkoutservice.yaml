fullnameOverride: checkoutservice

image:
  repository: harbor.d2.dev-akamai-apl.net/team-checkout/checkoutservice
  pullPolicy: IfNotPresent
  tag: "main"

replicaCount: 1

containerPorts:
  - name: grpc
    containerPort: 5050
    protocol: TCP

servicePorts:
  - port: 5050
    targetPort: grpc
    protocol: TCP
    name: grpc

env:
  - name: PORT
    value: "5050"
  - name: PRODUCT_CATALOG_SERVICE_ADDR
    value: "productcatalogservice.team-productcatalog:3550"
  - name: SHIPPING_SERVICE_ADDR
    value: "shippingservice.team-shipping:50051"
  - name: PAYMENT_SERVICE_ADDR
    value: "paymentservice.team-payment:50051"
  - name: EMAIL_SERVICE_ADDR
    value: "emailservice.team-email:5000"
  - name: CURRENCY_SERVICE_ADDR
    value: "currencyservice.team-currency:7000"
  - name: CART_SERVICE_ADDR
    value: "cartservice.team-cart:7070"
  - name: COLLECTOR_SERVICE_ADDR
    value: "opentelemetrycollector.otel:4317"
  - name: OTEL_SERVICE_NAME
    value: "checkoutservice"

livenessProbe:
  grpc:
    port: 5050

readinessProbe:
  grpc:
    port: 5050

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

podSecurityContext:
  fsGroup: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
