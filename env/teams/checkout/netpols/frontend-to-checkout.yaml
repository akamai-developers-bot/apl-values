kind: AplTeamNetworkControl
metadata:
    name: frontend-to-checkout
    labels:
        apl.io/teamId: checkout
spec:
    ruleType:
        ingress:
            allow:
                - fromLabelName: app.kubernetes.io/instance
                  fromLabelValue: frontend
                  fromNamespace: team-frontend
            mode: AllowOnly
            toLabelName: app.kubernetes.io/instance
            toLabelValue: checkoutservice
        type: ingress
