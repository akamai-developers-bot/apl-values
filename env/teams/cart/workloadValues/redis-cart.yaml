# Service name must match the REDIS_ADDR expected by cartservice: redis-cart:6379
fullnameOverride: redis-cart

replicas: 1
hardAntiAffinity: false

sentinel:
  quorum: 1

redis:
  port: 6379
  resources:
    requests:
      cpu: 70m
      memory: 200Mi
    limits:
      cpu: 125m
      memory: 256Mi

persistentVolume:
  enabled: false

emptyDir: {}

prometheusRule:
  namespace: ""

haproxy:
  tls:
    keyName: ""
  service:
    loadBalancerIP: ""
