kind: AplTeamBuild
metadata:
    name: cartservice-main
    labels:
        apl.io/teamId: cart
spec:
    externalRepo: true
    imageName: cartservice
    mode:
        docker:
            envVars: []
            path: src/Dockerfile
            repoUrl: https://github.com/Ani1357/cartservice.git
            revision: main
        type: docker
    scanSource: false
    tag: main
    trigger: false
