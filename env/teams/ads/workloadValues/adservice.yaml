fullnameOverride: adservice

image:
  repository: harbor.d2.dev-akamai-apl.net/team-ad/adservice
  pullPolicy: IfNotPresent
  tag: "main"

replicaCount: 1

containerPorts:
  - name: grpc
    containerPort: 9555
    protocol: TCP

servicePorts:
  - port: 9555
    targetPort: grpc
    protocol: TCP
    name: grpc

env:
  - name: PORT
    value: "9555"
  - name: DISABLE_STATS
    value: "1"
  - name: DISABLE_TRACING
    value: "1"

livenessProbe:
  initialDelaySeconds: 20
  periodSeconds: 15
  grpc:
    port: 9555

readinessProbe:
  initialDelaySeconds: 20
  periodSeconds: 15
  grpc:
    port: 9555

resources:
  requests:
    cpu: 200m
    memory: 180Mi
  limits:
    cpu: 300m
    memory: 300Mi

podSecurityContext:
  fsGroup: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true