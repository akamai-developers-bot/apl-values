fullnameOverride: emailservice

image:
  repository: harbor.d2.dev-akamai-apl.net/team-email/emailservice
  pullPolicy: IfNotPresent
  tag: "main"

replicaCount: 1

containerPorts:
  - name: grpc
    containerPort: 8080
    protocol: TCP

servicePorts:
  - port: 5000
    targetPort: grpc
    protocol: TCP
    name: grpc

env:
  - name: PORT
    value: "8080"
  - name: DISABLE_PROFILER
    value: "1"
  - name: COLLECTOR_SERVICE_ADDR
    value: "opentelemetrycollector.otel:4317"
  - name: OTEL_SERVICE_NAME
    value: "emailservice"

livenessProbe:
  periodSeconds: 5
  grpc:
    port: 8080

readinessProbe:
  periodSeconds: 5
  grpc:
    port: 8080

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

podSecurityContext:
  fsGroup: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
