kind: AplTeamBuild
metadata:
    name: emailservice-main
    labels:
        apl.io/teamId: email
spec:
    externalRepo: true
    imageName: emailservice
    mode:
        docker:
            envVars: []
            path: Dockerfile
            repoUrl: https://github.com/Ani1357/emailservice.git
            revision: main
        type: docker
    scanSource: false
    tag: main
    trigger: false
