kind: AplTeamPolicy
metadata:
    name: restrict-volume-types
    labels:
        apl.io/teamId: email
spec:
    action: Audit
    customValues:
        - configMap
        - csi
        - downwardAPI
        - emptyDir
        - ephemeral
        - persistentVolumeClaim
        - projected
        - secret
    severity: medium
