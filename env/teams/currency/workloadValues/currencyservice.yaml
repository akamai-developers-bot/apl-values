fullnameOverride: currencyservice

image:
  repository: harbor.d2.dev-akamai-apl.net/team-currency/currencyservice
  pullPolicy: IfNotPresent
  tag: "main"

replicaCount: 1

containerPorts:
  - name: grpc
    containerPort: 7000
    protocol: TCP

servicePorts:
  - port: 7000
    targetPort: grpc
    protocol: TCP
    name: grpc

env:
  - name: PORT
    value: "7000"
  - name: DISABLE_PROFILER
    value: "1"
  - name: COLLECTOR_SERVICE_ADDR
    value: "opentelemetrycollector.otel:4317"
  - name: OTEL_SERVICE_NAME
    value: "currencyservice"


resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

podSecurityContext:
  fsGroup: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
