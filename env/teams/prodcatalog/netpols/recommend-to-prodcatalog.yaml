kind: AplTeamNetworkControl
metadata:
    name: recommendation-to-productcatalog
    labels:
        apl.io/teamId: prodcatalog
spec:
    ruleType:
        ingress:
            allow:
                - fromLabelName: app.kubernetes.io/instance
                  fromLabelValue: recommendationservice
                  fromNamespace: team-recommendation
            mode: AllowOnly
            toLabelName: app.kubernetes.io/instance
            toLabelValue: productcatalogservice
        type: ingress
