fullnameOverride: frontend

image:
  repository: harbor.d2.dev-akamai-apl.net/team-frontend/frontend
  pullPolicy: IfNotPresent
  tag: "main"

replicaCount: 1

containerPorts:
  - name: http
    containerPort: 8080
    protocol: TCP

servicePorts:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http

env:
  - name: PORT
    value: "8080"
  - name: PRODUCT_CATALOG_SERVICE_ADDR
    value: "productcatalogservice.team-productcatalog:3550"
  - name: CURRENCY_SERVICE_ADDR
    value: "currencyservice.team-currency:7000"
  - name: CART_SERVICE_ADDR
    value: "cartservice.team-cart:7070"
  - name: RECOMMENDATION_SERVICE_ADDR
    value: "recommendationservice.team-recommendation:8080"
  - name: SHIPPING_SERVICE_ADDR
    value: "shippingservice.team-shipping:50051"
  - name: CHECKOUT_SERVICE_ADDR
    value: "checkoutservice.team-checkout:5050"
  - name: AD_SERVICE_ADDR
    value: "adservice.team-ad:9555"
  - name: ENV_PLATFORM
    value: "local"
  - name: CYMBAL_BRANDING
    value: "false"
  - name: ENABLE_ASSISTANT
    value: "false"
  - name: ENABLE_SINGLE_SHARED_SESSION
    value: "false"
  - name: SHOPPING_ASSISTANT_SERVICE_ADDR
    value: "shoppingassistantservice:80"
  - name: COLLECTOR_SERVICE_ADDR
    value: "opentelemetrycollector.otel:4317"
  - name: OTEL_SERVICE_NAME
    value: "frontend"


livenessProbe:
  initialDelaySeconds: 10
  httpGet:
    path: "/_healthz"
    port: 8080

readinessProbe:
  initialDelaySeconds: 10
  httpGet:
    path: "/_healthz"
    port: 8080

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

podSecurityContext:
  fsGroup: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
