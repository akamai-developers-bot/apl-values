kind: AplTeamNetworkControl
metadata:
    name: loadgenerator-to-frontend
    labels:
        apl.io/teamId: frontend
spec:
    ruleType:
        ingress:
            allow:
                - fromLabelName: app.kubernetes.io/instance
                  fromLabelValue: loadgenerator
                  fromNamespace: team-loadgenerator
            mode: AllowOnly
            toLabelName: app.kubernetes.io/instance
            toLabelValue: frontend
        type: ingress
