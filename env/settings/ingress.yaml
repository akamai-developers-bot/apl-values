kind: AplIngress
metadata:
    name: ingress
spec:
    classes: []
    platformClass:
        className: platform
        gateway:
            autoscaling:
                enabled: true
                maxReplicas: 10
                minReplicas: 3
                targetCPUUtilizationPercentage: 80
                targetMemoryUtilizationPercentage: 80
            minAvailable: 1
            replicas: 3
            resources:
                limits:
                    cpu: 250m
                    memory: 256Mi
                requests:
                    cpu: 250m
                    memory: 128Mi
